name: Drug Review Pipeline

on:
  schedule:
    - cron: '0 3 * * 0'    # weekly; adjust or remove once you're ready
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Download NLTK data for nlpaug
        run: python -c "import nltk; nltk.download('wordnet'); nltk.download('averaged_perceptron_tagger')"

      - name: Scrape
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          export SERPAPI_KEY="${{ secrets.SERPAPI_KEY }}"
          export REDDIT_CLIENT_ID="${{ secrets.REDDIT_CLIENT_ID }}"
          export REDDIT_CLIENT_SECRET="${{ secrets.REDDIT_CLIENT_SECRET }}"
          python src/scrape.py

      - name: Impute
        run: python src/impute.py --input drug_reviews_clean.csv --output drug_reviews_imputed.csv

      - name: Classify
        run: python src/classify.py --input drug_reviews_imputed.csv --output drug_reviews_labeled.csv

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Setup Kaggle Credentials
        run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_API_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: Push labeled dataset to Kaggle
        run: |
          export KAGGLE_API_TOKEN="${{ secrets.KAGGLE_API_TOKEN }}"
          mkdir -p kaggle_dataset
          cp drug_reviews_labeled.csv kaggle_dataset/
          cat > kaggle_dataset/dataset-metadata.json << 'EOF'
          {"title": "drug-reviews-labeled", "id": "yogeshagowdaiiitdwd/drug-reviews-labeled", "licenses": [{"name": "CC0-1.0"}]}
          EOF
          kaggle datasets version -p kaggle_dataset -m "update $(date +%Y%m%d_%H%M)" --dir-mode zip || \
          kaggle datasets create -p kaggle_dataset --dir-mode zip

      - name: Trigger Kaggle GPU fine-tune
        run: |
          export KAGGLE_API_TOKEN="${{ secrets.KAGGLE_API_TOKEN }}"
          kaggle kernels push -p kaggle-kernel/
          echo "Waiting for Kaggle kernel to finish..."
          for i in $(seq 1 60); do
            STATUS=$(kaggle kernels status yogeshagowdaiiitdwd/drug-distilbert-finetune)
            echo "$STATUS"
            if echo "$STATUS" | grep -q "complete"; then
              echo "Kernel finished successfully"
              exit 0
            fi
            if echo "$STATUS" | grep -qi "error"; then
              echo "Kernel failed"
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for Kaggle kernel"
          exit 1

      - name: Push model to HF Hub
        run: |
          export HF_TOKEN="${{ secrets.HF_TOKEN }}"
          export MIN_ACCURACY="${{ secrets.MIN_ACCURACY }}"
          python src/push_artifacts.py --model_dir ./models/latest --repo_id yogeshagowda/mtech-model

      - name: Update Neon embeddings
        run: |
          export NEON_DATABASE_URL="${{ secrets.NEON_DATABASE_URL }}"
          python src/update_embeddings.py --input drug_reviews_labeled.csv
